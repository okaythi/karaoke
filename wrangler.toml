name = "karaoke"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "nixlabs-outro"
database_id = "09ddcfb3-f5e7-4e1e-86d7-fbd77bbf5ea9"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "gewoonthy-media"

# No public custom domains or r2.dev access may be enabled on this bucket.
[[r2_buckets]]
binding = "PROTECTED_MEDIA_BUCKET"
bucket_name = "karaoke-protected"

[vars]
PLAYBACK_HOSTNAMES = "karaoke.nixlabs.tech,karaoke-7n0.pages.dev"
# TURNSTILE_SITE_KEY is set in Pages after creating the dedicated Invisible widget.
# TURNSTILE_SECRET_KEY and PLAYBACK_SIGNING_SECRET are Pages secrets, never source.
TURNSTILE_SITE_KEY = "0x4AAAAAAFOhbuAhkt6Ru69-"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Minimalist dark background -->
  <rect width="256" height="256" rx="56" fill="#131211" />
  <!-- Elegant geometric K in Silk Cream and Brass -->
  <g transform="translate(56, 52)">
    <!-- Stem in Brass (#deb668) -->
    <rect x="0" y="0" width="24" height="152" rx="4" fill="#deb668" />
    <!-- Architectural diagonal arms in Silk Cream (#f5f0e6) -->
    <polygon points="24,76 96,0 128,0 52,76 128,152 96,152 24,76" fill="#f5f0e6" />
  </g>
</svg>